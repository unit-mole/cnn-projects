name: 05 Fine-Grained Image Classification VGG16 CI

on:
  push:
    paths:
      - "05-fine-grained-image-classification-vgg16/**"
      - ".github/workflows/05-fine-grained-image-classification-vgg16.yml"
  pull_request:
    paths:
      - "05-fine-grained-image-classification-vgg16/**"
      - ".github/workflows/05-fine-grained-image-classification-vgg16.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vgg16-fine-grained-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 05-fine-grained-image-classification-vgg16

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 05-fine-grained-image-classification-vgg16/requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt

      - name: Compile Python source
        run: python -m compileall src scripts app tests

      - name: Run unit tests
        run: pytest -q

      - name: Validate project and TensorFlow.js artifacts
        run: |
          python scripts/validate_project.py
          python scripts/validate_tfjs_artifacts.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate static web bundle
        run: node scripts/validate-web.mjs

      - name: Confirm required browser files
        run: |
          test -f web/index.html
          test -f web/style.css
          test -f web/app.js
          test -f web/metadata.json
          test -f web/tfjs_model/model.json
