name: 03 DenseNet Medical Image Classification CI

on:
  push:
    branches:
      - main
    paths:
      - "03-densenet-medical-image-classification/**"
      - ".github/workflows/03-densenet-medical-image-classification.yml"
  pull_request:
    branches:
      - main
    paths:
      - "03-densenet-medical-image-classification/**"
      - ".github/workflows/03-densenet-medical-image-classification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-03-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Project 03
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 03-densenet-medical-image-classification

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 03-densenet-medical-image-classification/requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Validate project structure and Keras archives
        run: python scripts/validate_project.py

      - name: Validate browser application source
        run: python scripts/validate_web_demo.py

      - name: Run unit tests without retraining
        run: python -m pytest -q

      - name: Check browser JavaScript syntax
        run: node --check web/assets/app.js

      - name: Confirm Project 03 web entry point
        run: test -f web/index.html
