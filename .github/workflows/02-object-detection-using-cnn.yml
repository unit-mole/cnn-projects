name: 02 Object Detection CNN CI

on:
  push:
    branches: [main]
    paths:
      - "02-object-detection-using-cnn/**"
      - ".github/workflows/02-object-detection-using-cnn.yml"
  pull_request:
    branches: [main]
    paths:
      - "02-object-detection-using-cnn/**"
      - ".github/workflows/02-object-detection-using-cnn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 02-object-detection-using-cnn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            02-object-detection-using-cnn/requirements.txt
            02-object-detection-using-cnn/requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}/02-object-detection-using-cnn
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Vercel website
        run: |
          npm run check
          node --check app.js
