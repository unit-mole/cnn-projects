name: 02 Object Detection CNN CI

on:
  push:
    branches: [main]
    paths:
      - "02-object-detection-using-cnn/**"
      - ".github/workflows/02-object-detection-using-cnn.yml"
  pull_request:
    branches: [main]
    paths:
      - "02-object-detection-using-cnn/**"
      - ".github/workflows/02-object-detection-using-cnn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: 02-object-detection-using-cnn

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            02-object-detection-using-cnn/requirements.txt
            02-object-detection-using-cnn/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app.py gradio_app.py src scripts tests

      - name: Run tests
        run: pytest -q

      - name: Validate application imports
        run: |
          python -c "import app; print('Gradio app import passed')"
          python -c "from src.inference_pipeline import load_detection_model; load_detection_model(); print('Model load passed')"
