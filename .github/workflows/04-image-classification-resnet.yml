name: 04 ResNet Image Classification CI

on:
  push:
    branches:
      - main
    paths:
      - "04-image-classification-resnet/**"
      - ".github/workflows/04-image-classification-resnet.yml"
  pull_request:
    branches:
      - main
    paths:
      - "04-image-classification-resnet/**"
      - ".github/workflows/04-image-classification-resnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-04-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: 04-image-classification-resnet

jobs:
  validate:
    name: Validate Project 04
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 04-image-classification-resnet/requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$PROJECT_DIR/requirements-ci.txt"

      - name: Compile Python source
        run: python -m compileall -q "$PROJECT_DIR/src" "$PROJECT_DIR/scripts" "$PROJECT_DIR/tests"

      - name: Run unit tests
        run: python -m pytest -q "$PROJECT_DIR/tests"

      - name: Validate project and TensorFlow.js artifacts
        run: python "$PROJECT_DIR/scripts/validate_project.py" --project-dir "$PROJECT_DIR"

      - name: Confirm required browser files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/web/index.html"
          test -f "$PROJECT_DIR/web/style.css"
          test -f "$PROJECT_DIR/web/app.js"
          test -f "$PROJECT_DIR/web/metadata.json"
          test -f "$PROJECT_DIR/web/tfjs_model/model.json"
          find "$PROJECT_DIR/web/tfjs_model" -maxdepth 1 -name "*.bin" -print -quit | grep -q .
          node --check "$PROJECT_DIR/web/app.js"
          echo "Project 04 validation passed."
