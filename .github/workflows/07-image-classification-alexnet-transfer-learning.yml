name: 07 AlexNet Image Classification CI and Pages

on:
  push:
    branches:
      - main
    paths:
      - "07-image-classification-alexnet-transfer-learning/**"
      - ".github/workflows/07-image-classification-alexnet-transfer-learning.yml"
  pull_request:
    paths:
      - "07-image-classification-alexnet-transfer-learning/**"
      - ".github/workflows/07-image-classification-alexnet-transfer-learning.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate AlexNet project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-image-classification-alexnet-transfer-learning

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            07-image-classification-alexnet-transfer-learning/requirements.txt
            07-image-classification-alexnet-transfer-learning/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q src scripts app tests train_model.py

      - name: Run tests
        run: pytest -q

      - name: Validate Python imports and TensorFlow.js manifest
        run: |
          python - <<'PY'
          from src.class_mapping import CIFAR10_CLASSES
          from src.image_preprocessing import preprocess_pil_image
          from src.inference_pipeline import get_top_k_predictions
          from src.model_conversion import validate_tfjs_model

          assert len(CIFAR10_CLASSES) == 10
          validate_tfjs_model("web/tfjs_model")
          print("Core imports and TensorFlow.js manifest validation passed.")
          PY

      - name: Validate static browser files
        run: |
          test -f web/index.html
          test -f web/style.css
          test -f web/app.js
          test -f web/metadata.json
          test -f web/tfjs_model/model.json
          test -f web/tfjs_model/group1-shard1of1.bin
          python scripts/validate_project.py
          python scripts/validate_github_pages.py

      - name: Check JavaScript syntax
        run: node --check web/app.js

  deploy:
    name: Publish AlexNet browser demo to gh-pages branch
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm deployment files exist
        run: |
          test -f 07-image-classification-alexnet-transfer-learning/web/index.html
          test -f 07-image-classification-alexnet-transfer-learning/web/style.css
          test -f 07-image-classification-alexnet-transfer-learning/web/app.js
          test -f 07-image-classification-alexnet-transfer-learning/web/metadata.json
          test -f 07-image-classification-alexnet-transfer-learning/web/tfjs_model/model.json
          test -f 07-image-classification-alexnet-transfer-learning/web/tfjs_model/group1-shard1of1.bin

      - name: Publish Project 07 to GitHub Pages subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./07-image-classification-alexnet-transfer-learning/web
          destination_dir: 07-image-classification-alexnet-transfer-learning
          keep_files: true
          enable_jekyll: false
          commit_message: "Deploy AlexNet TensorFlow.js browser demo"
