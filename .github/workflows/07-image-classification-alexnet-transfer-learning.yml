name: 07 PyTorch CNN and ONNX Pages

on:
  push:
    paths:
      - '07-image-classification-alexnet-transfer-learning/**'
      - '.github/workflows/07-image-classification-alexnet-transfer-learning.yml'
  pull_request:
    paths:
      - '07-image-classification-alexnet-transfer-learning/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-image-classification-alexnet-transfer-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/validate_project.py --require-onnx
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 07-image-classification-alexnet-transfer-learning/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
