name: 07 PyTorch CNN and ONNX CI

on:
  push:
    branches:
      - main
    paths:
      - "07-image-classification-alexnet-transfer-learning/**"
      - ".github/workflows/07-image-classification-alexnet-transfer-learning.yml"
  pull_request:
    branches:
      - main
    paths:
      - "07-image-classification-alexnet-transfer-learning/**"
      - ".github/workflows/07-image-classification-alexnet-transfer-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-07-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Project 07
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 07-image-classification-alexnet-transfer-learning

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 07-image-classification-alexnet-transfer-learning/requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Validate Project 07 deployment assets
        run: python scripts/validate_project.py --require-onnx

      - name: Run Project 07 tests
        run: python -m pytest -q

      - name: Check browser JavaScript syntax
        run: node --check web/app.js

      - name: Confirm Project 07 web entry point
        run: test -f web/index.html
