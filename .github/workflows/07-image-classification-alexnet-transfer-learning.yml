name: 07 AlexNet Image Classification CI

on:
  push:
    paths:
      - "07-image-classification-alexnet-transfer-learning/**"
      - ".github/workflows/07-image-classification-alexnet-transfer-learning.yml"
  pull_request:
    paths:
      - "07-image-classification-alexnet-transfer-learning/**"
      - ".github/workflows/07-image-classification-alexnet-transfer-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-image-classification-alexnet-transfer-learning

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            07-image-classification-alexnet-transfer-learning/requirements.txt
            07-image-classification-alexnet-transfer-learning/requirements-dev.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q src scripts app tests train_model.py

      - name: Run tests
        run: pytest -q

      - name: Validate Python imports without training
        run: |
          python - <<'PY'
          from src.class_mapping import CIFAR10_CLASSES
          from src.image_preprocessing import preprocess_pil_image
          from src.inference_pipeline import get_top_k_predictions
          from src.model_conversion import validate_tfjs_model
          assert len(CIFAR10_CLASSES) == 10
          validate_tfjs_model("web/tfjs_model")
          print("Core imports and TFJS manifest validation passed.")
          PY

      - name: Validate static web files
        run: |
          test -f web/index.html
          test -f web/style.css
          test -f web/app.js
          test -f web/metadata.json
          test -f web/tfjs_model/model.json
          python scripts/validate_project.py
          python scripts/validate_github_pages.py

      - name: Check JavaScript syntax
        run: node --check web/app.js

      - name: Confirm full training is intentionally skipped
        run: echo "CI validates code and artifacts but does not retrain AlexNet or MobileNetV2."
