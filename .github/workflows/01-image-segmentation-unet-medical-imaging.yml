name: 01 Medical Image Segmentation U-Net CI

on:
  push:
    paths:
      - "01-image-segmentation-unet-medical-imaging/**"
      - ".github/workflows/01-image-segmentation-unet-medical-imaging.yml"
  pull_request:
    paths:
      - "01-image-segmentation-unet-medical-imaging/**"
      - ".github/workflows/01-image-segmentation-unet-medical-imaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-unet-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: 01-image-segmentation-unet-medical-imaging
  PYTHONUNBUFFERED: "1"
  TF_CPP_MIN_LOG_LEVEL: "2"
  CUDA_VISIBLE_DEVICES: "-1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            01-image-segmentation-unet-medical-imaging/requirements.txt
            01-image-segmentation-unet-medical-imaging/requirements-training.txt
            01-image-segmentation-unet-medical-imaging/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Python syntax
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m compileall -q app.py gradio_app.py src scripts tests

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: pytest -q

      - name: Validate Gradio app import
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -c "import app; assert app.demo is not None; print('Gradio app import: OK')"

      - name: Validate inference module import
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -c "from src.inference_pipeline import InferenceEngine; print('Inference import: OK')"

      - name: Run one-image model smoke test
        working-directory: ${{ env.PROJECT_DIR }}
        run: python scripts/smoke_test.py
