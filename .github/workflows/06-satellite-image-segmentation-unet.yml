name: 06 Satellite Image Segmentation U-Net CI

on:
  push:
    branches: [main]
    paths:
      - "06-satellite-image-segmentation-unet/**"
      - ".github/workflows/06-satellite-image-segmentation-unet.yml"
  pull_request:
    branches: [main]
    paths:
      - "06-satellite-image-segmentation-unet/**"
      - ".github/workflows/06-satellite-image-segmentation-unet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnn-06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 06-satellite-image-segmentation-unet

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            06-satellite-image-segmentation-unet/requirements.txt
            06-satellite-image-segmentation-unet/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate repository artifacts
        run: python scripts/validate_project.py

      - name: Run tests
        run: pytest -q

      - name: Validate app and inference imports
        run: |
          python -c "import app; import gradio_app; import src.inference_pipeline"

      - name: Run one lightweight model inference
        run: |
          python - <<'PY'
          from PIL import Image
          from src.inference_pipeline import InferencePipeline
          pipeline = InferencePipeline()
          image = Image.open('data/sample_images/synthetic_tile_01.png')
          result = pipeline.predict(image)
          assert result.binary_mask.shape == (64, 64)
          print('Inference smoke test passed.')
          PY
